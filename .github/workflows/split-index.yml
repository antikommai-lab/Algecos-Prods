name: split-index
on:
  push:
    branches: [main]
    paths: ['_split_trigger.txt']
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p _parts
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');const cps=Array.from(s);const n=Math.ceil(cps.length/18000);for(let i=0;i<n;i++)fs.writeFileSync('_parts/index_'+i+'.txt',cps.slice(i*18000,(i+1)*18000).join(''));console.log('parts='+n+' cps='+cps.length);"
          git config user.name github-actions
          git config user.email actions@github.com
          git add _parts
          git commit -m "auto-split index.html for readback"
          git push
