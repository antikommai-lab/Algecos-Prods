<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALGECOS-PRODS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap');
:root{--bg:#161616;--panel:#1d1d1b;--ink:#e8e6e0;--dim:#8a877e;--y:#FFD700;--line:#2e2d29;--warn:#ff4d5e;--orange:#F74C00}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Space Mono',monospace;background:var(--bg);color:var(--ink);min-height:100vh;
 background-image:url('logo.jpg');
 background-size:cover;background-position:center;background-attachment:fixed;background-blend-mode:multiply;
 background-color:#2a2a2a}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
 background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.06) 3px 5px);
 mix-blend-mode:overlay}
main,header{position:relative;z-index:1}
header{padding:26px 20px 14px;border-bottom:4px solid var(--y);position:relative;background:rgba(16,16,16,.82)}
.brand{display:flex;align-items:center;gap:14px}
.tri{height:88px;width:auto;max-width:220px;object-fit:contain;flex:none;filter:drop-shadow(3px 3px 0 #000)}
.brand h1{font-family:'Archivo Black',sans-serif;font-size:clamp(1.2rem,4vw,2rem);letter-spacing:.06em;color:var(--ink);text-transform:uppercase;line-height:1.05}
.brand h1 b{color:var(--y)}
.brand .tag{font-size:.62rem;color:var(--dim);letter-spacing:.28em;text-transform:uppercase}
#burger{position:absolute;top:16px;right:16px;width:44px;height:44px;background:var(--y);color:#000;border:none;font-size:1.3rem;font-weight:700;cursor:pointer;border:2px solid #000;box-shadow:3px 3px 0 #000}
#burger:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #000}
#menu{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;z-index:20}
#menu.open{display:block}
#panel{position:absolute;top:0;right:0;width:min(330px,88vw);height:100%;background:var(--panel);border-left:4px solid var(--y);padding:20px;overflow-y:auto}
#panel h2{font-size:.72rem;color:var(--y);text-transform:uppercase;letter-spacing:.22em;margin:18px 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px}
#panel button.mitem{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;background:#000;color:var(--ink);border:1px solid var(--line);border-left:4px solid var(--y);font-family:'Space Mono',monospace;font-size:.85rem;cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
#panel button.mitem:hover{background:var(--y);color:#000}
#panel a.mitem{display:block;width:100%;text-align:left;margin-bottom:8px;padding:12px 14px;background:#000;color:var(--orange);border:1px solid var(--line);border-left:4px solid var(--orange);font-family:'Space Mono',monospace;font-size:.85rem;cursor:pointer;text-transform:uppercase;letter-spacing:.05em;text-decoration:none}
#panel a.mitem:hover{background:var(--orange);color:#000}
#panel input,#panel textarea,#panel select{width:100%;padding:10px;background:#000;color:var(--ink);border:1px solid var(--line);font-family:'Space Mono',monospace;font-size:.85rem;margin-bottom:8px}
#panel label{display:block;font-size:.68rem;color:var(--dim);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.1em}
/* ===== HOME : playlist ===== */
#home{max-width:900px;margin:26px auto;padding:0 20px}
#home.hidden{display:none}
#homeFlex{display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap}
#bigLogo{display:none}
@media(min-width:900px){#bigLogo{display:block;width:100%;max-width:340px;margin:0 auto;border:3px solid #000;box-shadow:7px 7px 0 #000;transform:rotate(-1.4deg)}}
#homeCol{flex:1;min-width:270px}
.tape{background:var(--y);color:#000;display:inline-block;padding:3px 10px;font-size:.62rem;font-weight:700;letter-spacing:.2em;text-transform:uppercase;transform:rotate(-1.2deg);box-shadow:2px 2px 0 #000}
#plTitle{font-family:'Archivo Black',sans-serif;font-size:clamp(1.4rem,5vw,2.4rem);text-transform:uppercase;margin:14px 0 4px;color:var(--ink)}
#plDesc{color:var(--dim);font-size:.78rem;margin-bottom:18px}
#plRow{display:flex;gap:14px;align-items:flex-start}
#plPlay{display:flex;align-items:center;gap:10px;width:auto;flex:1;max-width:340px;background:#000;color:var(--y);border:4px solid var(--y);border-radius:12px;padding:12px 16px;margin-bottom:14px;font-family:'Space Mono',monospace;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.1em;cursor:pointer;box-shadow:4px 4px 0 #000}
#plPlay:hover{background:var(--y);color:#000}
#plPlay svg{flex:none}
#plPlay:hover svg *{stroke:#000}
#plCover{width:96px;height:96px;object-fit:cover;border:3px solid var(--y);border-radius:10px;transform:rotate(-4deg);box-shadow:5px 5px 0 #000;cursor:zoom-in;flex:none;margin-bottom:14px}
#plist{border:4px solid var(--y);border-radius:12px;background:rgba(16,16,16,.85);overflow:visible}
.psec{background:var(--y);color:#000;padding:8px 14px;font-family:'Archivo Black',sans-serif;font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;border-bottom:2px solid #000}
.prow{position:relative;display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:none}
.prow:hover{background:#000;outline:1px solid var(--y)}
.prow.on{background:var(--y);color:#000}
.prow.on .pidx,.prow.on .pver{color:#000}
.prow.on .pt small{color:#222}
.plabel{position:absolute;top:-11px;right:10px;z-index:2;background:var(--y);color:#000;font-weight:700;font-size:.6rem;padding:2px 8px;transform:rotate(2deg);box-shadow:2px 2px 0 #000;pointer-events:none;letter-spacing:.1em;text-transform:uppercase}
.pidx{color:var(--y);font-weight:700;min-width:28px}
.pt{flex:1;min-width:0}
.pt b{display:block;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pt small{color:var(--dim);font-size:.68rem;text-transform:uppercase;letter-spacing:.08em}
.pver{font-size:.6rem;border:1px solid currentColor;padding:1px 6px;text-transform:uppercase}
/* ===== LISTE DES MORCEAUX ===== */
#listWrap{display:none;max-width:1000px;margin:20px auto;padding:0 20px 90px}
#listWrap.open{display:block}
/* ===== TOUTES LES PLAYLISTS ===== */
#plistsWrap{display:none;max-width:1000px;margin:20px auto;padding:0 20px 90px}
#plistsWrap.open{display:block}
.secH{font-family:'Archivo Black',sans-serif;color:var(--y);text-transform:uppercase;letter-spacing:.08em;font-size:1.2rem;margin:10px 0 16px}
#plGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.plcard{background:rgba(16,16,16,.88);border:1px solid var(--line);border-top:4px solid var(--y);padding:14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.plcard:hover{outline:1px solid var(--y)}
.plcard .plc{width:64px;height:64px;object-fit:cover;border:2px solid var(--y);flex:none}
.plcard .plbox{flex:1;min-width:0}
.plcard h3{font-family:'Archivo Black',sans-serif;font-size:.95rem;text-transform:uppercase;margin-bottom:4px}
.plcard .pld{color:var(--dim);font-size:.7rem;margin-bottom:6px;line-height:1.5}
.plcard .pln{color:var(--y);font-size:.62rem;text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.plcard .btn{padding:7px 12px;font-size:.68rem}
/* ===== recherche / cartes ===== */
.btn{padding:10px 16px;background:var(--y);color:#000;border:2px solid #000;font-family:'Space Mono',monospace;font-weight:700;text-transform:uppercase;cursor:pointer;box-shadow:3px 3px 0 #000}
.btn2{padding:10px 16px;background:transparent;color:var(--dim);border:1px solid var(--line);font-family:'Space Mono',monospace;cursor:pointer;text-transform:uppercase}
.search-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.search-bar input{flex:1;min-width:180px;padding:12px 14px;background:rgba(16,16,16,.85);border:1px solid var(--line);color:var(--ink);font-family:'Space Mono',monospace}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:.68rem;padding:4px 10px;border:1px solid var(--line);color:var(--dim);cursor:pointer;background:rgba(16,16,16,.85);text-transform:uppercase}
.tag:hover,.tag.on{color:#000;background:var(--y);border-color:var(--y)}
#count{color:var(--dim);font-size:.72rem;margin-bottom:12px;text-transform:uppercase;letter-spacing:.1em}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.card{background:rgba(16,16,16,.88);background-size:cover;background-position:center;border:1px solid var(--line);border-top:4px solid var(--y);padding:14px;position:relative}
.card h3{font-size:.92rem;margin:4px 0 6px;padding-right:100px;font-family:'Archivo Black',sans-serif;text-transform:uppercase}
.ver{display:inline-block;margin-bottom:6px;font-size:.6rem;background:var(--y);color:#000;padding:2px 7px;font-weight:700;text-transform:uppercase}
.card .meta{font-size:.68rem;color:var(--dim);margin-bottom:8px;display:flex;flex-wrap:wrap;gap:5px}
.card .meta em{font-style:normal;border:1px solid var(--line);padding:1px 7px;text-transform:uppercase}
.card .style{font-size:.72rem;color:var(--y);margin-bottom:6px;text-transform:uppercase}
.card .info{font-size:.66rem;color:var(--dim);margin-bottom:8px;line-height:1.6}
.card .desc{font-size:.74rem;color:#a5a29a;margin-bottom:10px}
.play{width:100%;padding:9px;background:var(--y);color:#000;border:2px solid #000;font-family:'Space Mono',monospace;font-weight:700;cursor:pointer;text-transform:uppercase}
.play:hover{background:var(--ink)}
.stars{position:absolute;top:12px;right:12px;font-size:.9rem;letter-spacing:2px;user-select:none}
.stars span{color:#3a3833}
.stars span.on{color:var(--y)}
#empty{display:none;text-align:center;color:var(--dim);padding:40px;text-transform:uppercase}
#contact{text-align:center;padding:36px 16px 110px;color:var(--dim);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em}
#contact a{color:var(--y);text-decoration:none;font-family:'Space Mono',monospace}
#contact a:hover{text-decoration:underline}
/* ===== player ===== */
#player{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:4px solid var(--y);padding:12px 16px;display:none;z-index:14;max-height:48vh;overflow-y:auto}
#player.show{display:block}
#pTop{display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px}
#tCover{width:72px;height:72px;object-fit:cover;border:2px solid var(--y);display:none;cursor:zoom-in;flex:none}
#pInfo{flex:1;min-width:220px}
#pInfo b{color:var(--y);font-size:.95rem;text-transform:uppercase;display:block;margin-bottom:3px}
.psub{font-size:.68rem;color:var(--dim);margin-bottom:3px;line-height:1.5}
#ptags{color:#a5a29a;text-transform:uppercase;letter-spacing:.05em}
.pstars{font-size:.8rem;letter-spacing:2px;margin:4px 0}
.pstars span{color:#3a3833}
.pstars span.on{color:var(--y)}
#pAvg{color:var(--dim);font-size:.66rem;margin-left:6px}
#tTime{color:var(--ink);font-size:.78rem;font-weight:700}
.pctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:none}
.pbtn{background:#000;color:var(--y);border:1px solid var(--y);padding:9px 12px;font-family:'Space Mono',monospace;font-weight:700;font-size:.8rem;cursor:pointer}
.pbtn:hover:not(:disabled){background:var(--y);color:#000}
.pbtn:disabled{opacity:.25;cursor:default}
audio{width:100%;height:40px}
/* ===== modals ===== */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--panel);border:2px solid var(--y);padding:20px;width:min(430px,100%);max-height:90vh;overflow-y:auto;box-shadow:8px 8px 0 #000}
.mbox h3{margin-bottom:12px;color:var(--y);font-family:'Archivo Black',sans-serif;text-transform:uppercase;font-size:1rem}
.mbox label{display:block;font-size:.66rem;color:var(--dim);margin:8px 0 4px;text-transform:uppercase;letter-spacing:.1em}
.mbox input,.mbox textarea,.mbox select{width:100%;padding:9px;background:#000;color:var(--ink);border:1px solid var(--line);font-family:'Space Mono',monospace;font-size:.82rem}
.mbox .row{display:flex;gap:8px;margin-top:14px}
.close{float:right;background:none;border:none;color:var(--dim);font-size:1.2rem;cursor:pointer}
.status{font-size:.72rem;margin-top:8px;min-height:1em}
.ok{color:var(--y)}.err{color:var(--warn)}
/* login */
.lbtn{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;margin-bottom:8px;background:#000;color:var(--ink);border:1px solid var(--line);font-family:'Space Mono',monospace;font-size:.8rem;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.05em}
.lbtn:hover{border-color:var(--y);color:var(--y)}
#uMe{display:flex;align-items:center;gap:10px;padding:8px 0}
#uMe img{width:34px;height:34px;border-radius:50%;border:2px solid var(--y)}
#uMe b{font-size:.78rem}
/* commentaires */
#cmtList{margin-bottom:12px;max-height:32vh;overflow-y:auto}
.cmt{border:1px solid var(--line);padding:8px 10px;margin-bottom:8px;background:#000}
.cmt .cH{font-size:.64rem;color:var(--y);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.cmt .cB{font-size:.76rem;line-height:1.5}
/* viewer image */
#imgModal{flex-direction:column}
#imgBig{max-width:92vw;max-height:74vh;border:4px solid var(--y);border-radius:12px;box-shadow:10px 10px 0 #000;transition:transform .15s;cursor:zoom-in;background:#000}
#imgBig.zoom{transform:scale(2);cursor:zoom-out}
#imgCap{color:var(--dim);font-size:.68rem;margin-top:10px;text-transform:uppercase;letter-spacing:.1em}
.vcross{position:fixed;top:18px;right:18px;width:38px;height:38px;border-radius:50%;background:var(--y);color:#000;border:2px solid #000;font-weight:700;font-size:1rem;cursor:pointer;z-index:45;box-shadow:2px 2px 0 #000}
.vnav{position:fixed;top:50%;width:54px;height:54px;background:#000;color:var(--y);border:2px solid var(--y);font-size:2rem;line-height:1;cursor:pointer;display:none;z-index:45;box-shadow:4px 4px 0 #000}
#vL{left:16px}
#vR{right:16px}
/* lyrics */
#lyrBox{background:#000;border:1px solid var(--line);padding:12px;font-size:.78rem;line-height:1.7;white-space:pre-wrap;max-height:56vh;overflow-y:auto;color:var(--ink)}
</style>
</head>

<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script>
/* ===== CONFIG — à remplir ===== */
var SUPABASE_URL='https://TON-PROJET.supabase.co';
var SUPABASE_ANON_KEY='TA-CLE-ANON';
var ADMIN_EMAILS=['algecosprods@gmail.com'];
var SITE_URL='https://antikommai-lab.github.io/Algecos-Prods/';
var GH_OWNER='antikommai-lab',GH_REPO='Algecos-Prods';

var TRACKS=[],PLAYLISTS=[],PLAYLIST=null,activeTag='';
var CURRENT=null,CURRENTLIST=[],PCV=0;
var LYR={open:false,el:null};
var VIEW={imgs:[],i:0};
var EXTS=['jpg','jpeg','png','webp','gif'];
var SB=null,USER=null,GHTOK=localStorage.getItem('gh_pat')||'';
function $(id){return document.getElementById(id);}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function fmt(s){s=Math.max(0,Math.floor(s||0));var m=Math.floor(s/60),r=s%60;return (m<10?'0':'')+m+':'+(r<10?'0':'')+r;}
function stripExt(s){s=String(s);var l=s.toLowerCase();var E=['.mp3','.wav','.ogg','.m4a','.flac'];
 for(var i=0;i<E.length;i++){if(l.slice(-E[i].length)===E[i])return s.slice(0,s.length-E[i].length);}return s;}
function base(s){s=String(s);var p=s.lastIndexOf('/');return p<0?s:s.slice(p+1);}
function norm(s){return stripExt(String(s==null?'':s)).toLowerCase().trim();}
/* ===== matching robuste titre OU chemin fichier ===== */
function plMatch(ref){
 if(ref==null||typeof ref==='object')return null;
 var s=String(ref),t;
 t=TRACKS.find(function(x){return x.title===s||x.file===s;});if(t)return t;
 var b=norm(base(s));
 t=TRACKS.find(function(x){return norm(base(x.file))===b;});if(t)return t;
 t=TRACKS.find(function(x){return norm(x.title)===norm(s);});if(t)return t;
 if(s.trim().length>=8){var ns=norm(s);
  t=TRACKS.find(function(x){return norm(x.title).indexOf(ns)>-1;});if(t)return t;
  t=TRACKS.find(function(x){return norm(base(x.file)).indexOf(ns)>-1;});}
 return t||null;}
function entSec(r){return (r&&typeof r==='object')?(r.section||r.SECTION||r.Section||''):'';}
function entLabel(r){return (r&&typeof r==='object')?(r.label||r.LABEL||''):'';}
function entRef(r){if(typeof r==='string')return r;if(r&&typeof r==='object')return r.ref||r.title||r.file||null;return null;}
function plFlat(){var out=[];((PLAYLIST&&PLAYLIST.tracks)||[]).forEach(function(r){var t=plMatch(entRef(r));if(t)out.push(t);});return out;}
/* ===== covers ===== */
function tryCovers(paths,cb){var i=0;
 (function next(){if(i>=paths.length){cb(null);return;}
  var im=new Image();im.onload=function(){cb(paths[i]);};im.onerror=function(){i++;next();};im.src=encodeURI(paths[i]);})();}
function plCoverPaths(c){c=String(c||'');var out=[],i;
 if(c.indexOf('.')>0){out.push('img/'+c,c);}
 else{for(i=0;i<EXTS.length;i++){out.push('img/'+c+'.'+EXTS[i]);}for(i=0;i<EXTS.length;i++){out.push(c+'.'+EXTS[i]);}}
 return out;}
function trackCoverPaths(t){var out=[],i,b=String(t.title||'')+'_cover';
 for(i=0;i<EXTS.length;i++)out.push('img/'+b+'.'+EXTS[i]);
 for(i=0;i<EXTS.length;i++)out.push(b+'.'+EXTS[i]);
 return out;}
/* ===== auth Supabase ===== */
function sbReady(){return !!SB;}
function isAdmin(){return !!USER&&ADMIN_EMAILS.indexOf(String(USER.email||'').toLowerCase())>-1;}
async function initAuth(){
 try{SB=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);}catch(e){SB=null;renderAuth();return;}
 SB.auth.onAuthStateChange(function(ev,ses){USER=(ses&&ses.user)||null;renderAuth();});
 var s=await SB.auth.getSession();USER=(s&&s.data&&s.data.session&&s.data.session.user)||null;
 renderAuth();}
function loginGoogle(){if(!SB)return;SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});}
function loginGithub(){if(!SB)return;SB.auth.signInWithOAuth({provider:'github',options:{redirectTo:location.href}});}
function doLogout(){if(SB)SB.auth.signOut();USER=null;renderAuth();}
function renderAuth(){
 var z=$('authZone');
 if(!SB){z.innerHTML='<div class="status" style="color:var(--dim)">CONNEXION BIENTÔT DISPONIBLE</div>';$('admTitle').style.display='none';$('admZone').style.display='none';return;}
 if(USER){
  var av=(USER.user_metadata&&USER.user_metadata.avatar_url)||'';
  var nm=(USER.user_metadata&&USER.user_metadata.full_name)||USER.email;
  z.innerHTML='<div id="uMe">'+(av?'<img src="'+esc(av)+'" alt="">':'')+'<div><b>'+esc(nm)+'</b><br><small style="color:var(--dim);font-size:.62rem">'+esc(USER.email)+'</small>'+(isAdmin()?' <span style="color:var(--y);font-size:.62rem">★ ADMIN</span>':'')+'</div></div><button class="lbtn" onclick="doLogout()">⏻ Déconnexion</button>';
  if(isAdmin()){$('admTitle').style.display='block';$('admZone').style.display='block';}
  else{$('admTitle').style.display='none';$('admZone').style.display='none';}
 }else{
  z.innerHTML='<button class="lbtn" onclick="loginGoogle()">G Se connecter avec Google</button><button class="lbtn" onclick="loginGithub()">⌥ Se connecter avec GitHub</button>';
  $('admTitle').style.display='none';$('admZone').style.display='none';}}
function saveTok(){GHTOK=$('ghTok').value.trim();
 if(GHTOK){localStorage.setItem('gh_pat',GHTOK);$('tokStatus').className='status ok';$('tokStatus').textContent='MÉMORISÉ ✓';}
 else{$('tokStatus').className='status err';$('tokStatus').textContent='VIDE';}}
/* ===== commits GitHub (admin) ===== */
async function ghPut(path,contentB64,msg){
 var r=await fetch('https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path+'?ref=main&t='+Date.now(),{headers:{Authorization:'Bearer '+GHTOK,Accept:'application/vnd.github+json'}});
 var meta=await r.json();
 if(!meta.sha)throw new Error('SHA INTROUVABLE ('+(meta.message||r.status)+') — token ?');
 var pu=await fetch('https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+path,{method:'PUT',headers:{Authorization:'Bearer '+GHTOK,Accept:'application/vnd.github+json','Content-Type':'application/json'},
  body:JSON.stringify({message:msg,content:contentB64,sha:meta.sha,branch:'main'})});
 if(!pu.ok)throw new Error('COMMIT KO ('+pu.status+')');
 return pu.json();}
function toB64(str){var B='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';var b64='';var bytes=[].slice.call(new TextEncoder().encode(str));
 for(var i=0;i<bytes.length;i+=3){var b1=bytes[i],b2=bytes[i+1],b3=bytes[i+2];
  b64+=B.charAt(b1>>2)+B.charAt(((b1&3)<<4)|(b2==null?0:b2>>4))+(b2==null?'=':B.charAt(((b2&15)<<2)|(b3==null?0:b3>>6)))+(b3==null?'=':B.charAt(b3&63));}
 return b64;}
function buildFeed(){
 var items=TRACKS.slice().sort(function(a,b){return String(b.recordDate||'').localeCompare(String(a.recordDate||''));}).slice(0,20).map(function(t){
  var d=t.recordDate?new Date(t.recordDate+'T12:00:00Z'):new Date();
  return '<item><title>'+esc(t.title)+(t.version?' ['+esc(t.version)+']':'')+'</title><link>'+SITE_URL+'</link><guid isPermaLink="false">algecos-'+esc(t.title)+'-'+esc(t.version||'')+'</guid><pubDate>'+d.toUTCString()+'</pubDate><description>'+esc((t.style||'')+' — '+(t.desc||''))+'</description></item>';}).join('');
 return '<?xml version="1.0" encoding="UTF-8"?><rss version="2.0"><channel><title>ALGECOS-PRODS</title><link>'+SITE_URL+'</link><description>Nouveaux morceaux ANTIKOMM — division ALGECOS</description>'+items+'</channel></rss>';}
async function publishAll(msg){
 if(!GHTOK)throw new Error('TOKEN GITHUB REQUIS (☰ Admin)');
 await ghPut('tracks.json',toB64(JSON.stringify(TRACKS,null,2)),msg);
 await ghPut('playlists.json',toB64(JSON.stringify(PLAYLISTS,null,2)),msg);
 await ghPut('feed.xml',toB64(buildFeed()),'flux RSS : '+msg);}
/* ===== formulaires admin ===== */
var tmIdx=-1;
function openTrackForm(mode){
 if(mode===-1){tmIdx=-1;$('tmTitle').textContent='+ Ajouter un morceau';$('tmSelWrap').style.display='none';
  ['f_title','f_file','f_tags','f_style','f_version','f_desc','f_lyr','f_snd','f_date'].forEach(function(id){$(id).value='';});
  $('f_rating').value=3;}
 else{$('tmTitle').textContent='✎ Modifier un morceau';$('tmSelWrap').style.display='block';
  $('tmSel').innerHTML=TRACKS.map(function(t,i){return '<option value="'+i+'">'+esc(t.title)+'</option>';}).join('');
  tmIdx=0;fillTrack();}
 $('mStatus').textContent='';openModal('trackModal');}
function fillTrack(){tmIdx=+$('tmSel').value;var t=TRACKS[tmIdx];if(!t)return;
 $('f_title').value=t.title;$('f_file').value=t.file||'';
 $('f_tags').value=(t.tags||[]).join(', ');
 $('f_style').value=t.style||'';$('f_version').value=t.version||'';$('f_desc').value=t.desc||'';
 $('f_lyr').value=t.lyricsCreator||'';$('f_snd').value=t.soundCreator||'';
 $('f_date').value=t.recordDate||'';$('f_rating').value=t.rating||3;}
async function saveTrack(){
 var ti=$('f_title').value.trim();
 if(!ti||!$('f_file').value.trim()){$('mStatus').className='status err';$('mStatus').textContent='TITRE + FICHIER REQUIS';return;}
 var o=tmIdx>-1?Object.assign({},TRACKS[tmIdx]):{};
 o.title=ti;o.file=$('f_file').value.trim();
 o.tags=$('f_tags').value.split(',').map(function(s){return s.trim();}).filter(Boolean);
 o.style=$('f_style').value.trim();o.version=$('f_version').value.trim();o.desc=$('f_desc').value.trim();
 o.lyricsCreator=$('f_lyr').value.trim();o.soundCreator=$('f_snd').value.trim();
 o.recordDate=$('f_date').value;o.rating=+$('f_rating').value||0;
 if(tmIdx>-1)TRACKS[tmIdx]=o;else TRACKS.push(o);
 $('mStatus').className='status ok';$('mStatus').textContent='⏳ PUBLICATION…';
 try{await publishAll((tmIdx>-1?'edit':'add')+' : '+ti);
  closeModal('trackModal');await load();}
 catch(e){$('mStatus').className='status err';$('mStatus').textContent=e.message;}}
var pmIdx=-1;
function openPlForm(mode){
 if(mode===-1){pmIdx=-1;$('pmTitle').textContent='+ Nouvelle playlist';$('pmSelWrap').style.display='none';
  $('p_title').value='';$('p_desc').value='';$('p_cover').value='';$('p_tracks').value='';}
 else{$('pmTitle').textContent='✎ Modifier une playlist';$('pmSelWrap').style.display='block';
  $('pmSel').innerHTML=PLAYLISTS.map(function(p,i){return '<option value="'+i+'">'+esc(p.title)+'</option>';}).join('');
  pmIdx=0;fillPl();}
 $('pStatus').textContent='';openModal('plModal');}
function fillPl(){pmIdx=+$('pmSel').value;var p=PLAYLISTS[pmIdx];if(!p)return;
 $('p_title').value=p.title||'';$('p_desc').value=p.desc||'';$('p_cover').value=p.cover||'';
 $('p_tracks').value=(p.tracks||[]).map(function(r){
  if(typeof r==='string')return r;
  if(entSec(r))return 'SECTION: '+entSec(r);
  if(entLabel(r))return 'LABEL: '+entLabel(r)+' :: '+entRef(r);
  return entRef(r)||'';}).join(String.fromCharCode(10));}
async function savePl(){
 var ti=$('p_title').value.trim();
 if(!ti){$('pStatus').className='status err';$('pStatus').textContent='TITRE REQUIS';return;}
 var lines=$('p_tracks').value.split(String.fromCharCode(10)).map(function(s){return s.trim();}).filter(Boolean);
 var tracks=lines.map(function(l){
  var m=l.match(/^SECTION\s*:\s*(.+)$/i);
  if(m){var o={};o.SECTION=m[1].trim();return o;}
  m=l.match(/^LABEL\s*:\s*(.+?)\s*::\s*(.+)$/i);
  if(m)return {label:m[1].trim(),ref:m[2].trim()};
  return l;});
 var p={title:ti,desc:$('p_desc').value.trim(),cover:$('p_cover').value.trim()||undefined,tracks:tracks};
 if(pmIdx>-1)PLAYLISTS[pmIdx]=p;else PLAYLISTS.push(p);
 $('pStatus').className='status ok';$('pStatus').textContent='⏳ PUBLICATION…';
 try{await publishAll('playlist : '+ti);
  closeModal('plModal');PLAYLIST=PLAYLISTS[0];await load();}
 catch(e){$('pStatus').className='status err';$('pStatus').textContent=e.message;}}
/* ===== chargement ===== */
async function load(){
 try{var r=await fetch('tracks.json',{cache:'no-store'});TRACKS=await r.json();}catch(e){TRACKS=[];}
 try{var p=await fetch('playlists.json',{cache:'no-store'});PLAYLISTS=await p.json();}catch(e){PLAYLISTS=[];}
 if(!Array.isArray(PLAYLISTS))PLAYLISTS=[];
 if(!PLAYLIST||PLAYLISTS.indexOf(PLAYLIST)<0)PLAYLIST=PLAYLISTS[0]||{title:'—',desc:'',tracks:[]};
 renderPlaylist();renderPlists();
 var allTags=[];TRACKS.forEach(function(t){(t.tags||[]).forEach(function(k){if(allTags.indexOf(k)<0)allTags.push(k);});});
 allTags.sort();
 $('tags').innerHTML=allTags.map(function(t){return '<span class="tag" data-t="'+esc(t)+'">'+esc(t)+'</span>';}).join('');
 document.querySelectorAll('#tags .tag').forEach(function(el){el.onclick=function(){
  var v=el.getAttribute('data-t');activeTag=(activeTag===v)?'':v;
  document.querySelectorAll('#tags .tag').forEach(function(x){x.classList.toggle('on',x.getAttribute('data-t')===activeTag);});
  render();};});
 render();}
/* ===== playlist accueil ===== */
function renderPlaylist(){
 if(!PLAYLIST)return;
 $('plTitle').textContent=PLAYLIST.title||'PLAYLIST';
 $('plDesc').textContent=PLAYLIST.desc||'';
 if(PLAYLIST.cover){tryCovers(plCoverPaths(PLAYLIST.cover),function(u){var c=$('plCover');if(u){c.src=u;c.style.display='block';}else c.style.display='none';});}
 else $('plCover').style.display='none';
 var n=0,h='';
 ((PLAYLIST.tracks)||[]).forEach(function(r){
  var sec=entSec(r);
  if(sec){h+='<div class="psec">'+esc(sec)+'</div>';return;}
  var t=plMatch(entRef(r));if(!t)return;n++;
  var lab=entLabel(r);
  h+='<div class="prow" data-t="'+esc(t.title)+'" data-f="'+esc(t.file||'')+'">'
   +(lab?'<span class="plabel">'+esc(lab)+'</span>':'')
   +'<span class="pidx">'+String(n).padStart(2,'0')+'</span>'
   +'<span class="pt"><b>'+esc(t.title)+'</b><small>'+esc(t.style||'')+' · '+esc((t.tags||[]).slice(0,3).join(' / '))+'</small></span>'
   +(t.version?'<span class="pver">'+esc(t.version)+'</span>':'')+'</div>';});
 $('plist').innerHTML=h||'<div style="padding:16px;color:var(--dim);font-size:.75rem">PLAYLIST VIDE</div>';}
function playPlaylist(){var pl=plFlat();if(!pl.length)return;play(pl[0],pl);}
/* ===== toutes les playlists ===== */
function renderPlists(){
 $('plGrid').innerHTML=PLAYLISTS.map(function(p,i){
  var nb=((p.tracks)||[]).map(function(r){return plMatch(entRef(r))?1:0;}).reduce(function(a,b){return a+b;},0);
  return '<div class="plcard" data-i="'+i+'"><img class="plc" alt="" style="display:none"><div class="plbox"><h3>'+esc(p.title||'—')+'</h3><div class="pld">'+esc(p.desc||'')+'</div><div class="pln">'+nb+' morceaux</div><button class="btn">Ouvrir</button></div></div>';}).join('')||'<div style="color:var(--dim);padding:20px;text-transform:uppercase;font-size:.75rem">AUCUNE PLAYLIST.</div>';
 document.querySelectorAll('.plcard').forEach(function(cd){
  var p=PLAYLISTS[+cd.getAttribute('data-i')];
  if(p&&p.cover)tryCovers(plCoverPaths(p.cover),function(u){var im=cd.querySelector('.plc');if(u){im.src=u;im.style.display='block';}});
  cd.onclick=function(){PLAYLIST=PLAYLISTS[+cd.getAttribute('data-i')]||PLAYLIST;renderPlaylist();showView('home');};});}
/* ===== navigation ===== */
function showView(v){
 $('home').classList.toggle('hidden',v!=='home');
 $('listWrap').classList.toggle('open',v==='list');
 $('plistsWrap').classList.toggle('open',v==='plists');
 window.scrollTo({top:0});toggleMenuOff();}
function showList(full){showView(full===true?'list':'home');}
function showPlaylists(){showView('plists');}
function toggleMenu(){$('menu').classList.toggle('open');}
function toggleMenuOff(){var m=$('menu');if(m.classList.contains('open'))m.classList.remove('open');}
/* ===== liste des morceaux ===== */
function stars(n){var s='';for(var i=1;i<=5;i++)s+='<span class="'+(i<=(n||0)?'on':'')+'">★</span>';return s;}
function match(t,q){var hay=[t.title,(t.tags||[]).join(' '),t.desc||'',t.style||'',t.version||'',t.lyricsCreator||'',t.soundCreator||''].join(' ').toLowerCase();return hay.indexOf(q)>-1;}
function cardHTML(t,i){
 var h='<div class="card" data-i="'+i+'">';
 if(t.version)h+='<span class="ver">'+esc(t.version)+'</span>';
 h+='<div class="stars">'+stars(t.rating)+'</div><h3>'+esc(t.title)+'</h3>';
 if(t.style)h+='<div class="style">[ '+esc(t.style)+' ]</div>';
 h+='<div class="meta">'+(t.tags||[]).map(function(k){return '<em>'+esc(k)+'</em>';}).join('')+'</div>';
 h+='<div class="info">VO:'+esc(t.lyricsCreator||'—')+' / SND:'+esc(t.soundCreator||'—')+' / '+esc(t.recordDate||'—')+'</div>';
 h+='<div class="desc">'+esc(t.desc||'')+'</div>';
 h+='<button class="play" data-i="'+i+'">▶ Écouter</button></div>';return h;}
function render(){
 var q=$('q').value.toLowerCase().trim();
 var list=TRACKS.map(function(t,i){return {t:t,i:i};}).filter(function(o){
  return (!q||match(o.t,q))&&(!activeTag||(o.t.tags||[]).indexOf(activeTag)>-1);});
 $('count').textContent=list.length+'/'+TRACKS.length+' morceaux';
 $('grid').innerHTML=list.map(function(o){return cardHTML(o.t,o.i);}).join('');
 $('empty').style.display=list.length?'none':'block';
 document.querySelectorAll('.card').forEach(function(card){
  var t=TRACKS[+card.getAttribute('data-i')];if(!t)return;
  tryCovers(trackCoverPaths(t),function(u){if(u)card.style.backgroundImage='linear-gradient(rgba(16,16,16,.86),rgba(16,16,16,.86)),url("'+encodeURI(u)+'")';});});}
/* ===== player ===== */
function play(t,list){
 if(!t)return;
 CURRENT=t;CURRENTLIST=list||CURRENTLIST||[];
 var a=$('audio');
 a.src=encodeURI(t.file||'');a.play();
 $('player').classList.add('show');
 $('pt').textContent=t.title;
 $('pv').textContent=(t.version?'['+t.version+'] ':'')+(t.style||'');
 $('ptags').textContent=(t.tags||[]).join(' / ');
 $('pdesc').textContent=t.desc||'';
 $('pinfo').textContent='VO:'+(t.lyricsCreator||'—')+' / SND:'+(t.soundCreator||'—')+' / '+(t.recordDate||'—');
 $('pstars').innerHTML=stars(t.rating);$('pAvg').textContent='';
 var seq=++PCV;
 tryCovers(trackCoverPaths(t),function(u){if(seq!==PCV)return;var c=$('tCover');if(u){c.src=u;c.style.display='block';}else c.style.display='none';});
 if(sbReady())SB.from('ratings').select('stars').eq('track',t.title).then(function(res){
  if(seq!==PCV||!res.data||!res.data.length)return;
  var avg=res.data.reduce(function(a,b){return a+b.stars;},0)/res.data.length;
  $('pAvg').textContent='MOY '+Math.round(avg*10)/10+'/5 ('+res.data.length+')';});
 updateCtl();
 document.querySelectorAll('.prow').forEach(function(r){r.classList.toggle('on',r.getAttribute('data-t')===t.title&&r.getAttribute('data-f')===(t.file||''));});}
function updateCtl(){var i=CURRENTLIST.indexOf(CURRENT);
 $('prevBtn').disabled=i<=0;
 $('nextBtn').disabled=i<0||i>=CURRENTLIST.length-1;}
function plPrev(){var i=CURRENTLIST.indexOf(CURRENT);if(i>0)play(CURRENTLIST[i-1],CURRENTLIST);}
function plNext(){var i=CURRENTLIST.indexOf(CURRENT);if(i>-1&&i<CURRENTLIST.length-1)play(CURRENTLIST[i+1],CURRENTLIST);}
function sk(d){var a=$('audio');if(isFinite(a.duration))a.currentTime=Math.max(0,Math.min(a.duration,a.currentTime+d));}
async function rate(k){
 if(!CURRENT)return;
 if(!USER){openCmt();return;}
 if(!sbReady())return;
 var r=await SB.from('ratings').upsert({track:CURRENT.title,email:USER.email,stars:k});
 if(r.error){$('pAvg').textContent='ERREUR NOTE';return;}
 $('pstars').innerHTML=stars(k);
 SB.from('ratings').select('stars').eq('track',CURRENT.title).then(function(res){
  if(!res.data||!res.data.length)return;
  var avg=res.data.reduce(function(a,b){return a+b.stars;},0)/res.data.length;
  $('pAvg').textContent='MOY '+Math.round(avg*10)/10+'/5 ('+res.data.length+')';});}
/* ===== lyrics ===== */
function toggleLyr(){var m=$('lyrModal');
 if(m.classList.contains('open')){m.classList.remove('open');LYR.open=false;return;}
 m.classList.add('open');LYR.open=true;
 var b=$('lyrBox');b.textContent='…';
 if(!CURRENT){b.textContent='—';return;}
 $('lyrTitle').textContent='Lyrics — '+CURRENT.title;
 var tb=encodeURI('lyrics/'+CURRENT.title);
 var get=function(ext){return fetch(tb+ext,{cache:'no-store'}).then(function(r){return r.ok?r.text():null;});};
 get('.txt').then(function(x){return x!=null?x:get('.md');}).then(function(x){return x!=null?x:get('.json');}).then(function(tx){
  if(tx==null){b.textContent='Pas de paroles disponibles pour ce morceau.';return;}
  if(tb.slice(-5).toLowerCase()==='.json'){try{var j=JSON.parse(tx);var v=j.lyrics||j.text||j.content||null;
   if(v==null&&Array.isArray(j.lines))v=j.lines.join(String.fromCharCode(10));
   tx=v!=null?String(v):JSON.stringify(j,null,1);}catch(e){}}
  b.textContent=tx;LYR.el=b;scrollLyr();});}
function scrollLyr(){var a=$('audio');
 if(!LYR.open||!LYR.el||!isFinite(a.duration)||!a.duration)return;
 LYR.el.scrollTop=(a.currentTime/a.duration)*(LYR.el.scrollHeight-LYR.el.clientHeight);}
/* ===== commentaires ===== */
async function openCmt(){
 $('cmtModal').classList.add('open');
 $('cmtStatus').textContent='';$('cmtTxt'&&0);
 if(!sbReady()){$('cmtList').innerHTML='<div style="color:var(--dim);font-size:.75rem">Bientôt disponible.</div>';$('cmtForm').innerHTML='';return;}
 if(!USER){$('cmtForm').innerHTML='<div style="color:var(--dim);font-size:.75rem;line-height:1.6">Connecte-toi (☰ → Google ou GitHub) pour noter et commenter.</div>';$('cmtList').innerHTML='';return;}
 $('cmtForm').innerHTML='<label>Ton commentaire</label><textarea id="cmtTxt" rows="3"></textarea><div class="row"><button class="btn" onclick="sendCmt()">Envoyer</button></div>';
 $('cmtList').innerHTML='<div style="color:var(--dim);font-size:.75rem">…</div>';
 if(!CURRENT)return;
 var res=await SB.from('comments').select('*').eq('track',CURRENT.title).order('created_at',{ascending:false}).limit(50);
 if(res.error){$('cmtList').innerHTML='<div style="color:var(--warn);font-size:.75rem">'+esc(res.error.message)+'</div>';return;}
 if(!res.data.length){$('cmtList').innerHTML='<div style="color:var(--dim);font-size:.75rem">Aucun commentaire — sois le premier !</div>';return;}
 $('cmtList').innerHTML=res.data.map(function(c){
  return '<div class="cmt"><div class="cH">'+esc(c.name||c.email||'?')+' · '+String(c.created_at||'').slice(0,10)+'</div><div class="cB">'+esc(c.body)+'</div></div>';}).join('');}
async function sendCmt(){
 if(!USER||!CURRENT||!sbReady())return;
 var el=$('cmtTxt');var b=el?el.value.trim():'';
 if(!b){$('cmtStatus').className='status err';$('cmtStatus').textContent='VIDE';return;}
 var r=await SB.from('comments').insert({track:CURRENT.title,body:b,name:(USER.user_metadata&&USER.user_metadata.full_name)||USER.email.split('@')[0],email:USER.email});
 if(r.error){$('cmtStatus').className='status err';$('cmtStatus').textContent=r.error.message;return;}
 openCmt();}
function closeModal(id){$(id).classList.remove('open');if(id==='lyrModal')LYR.open=false;}
function openModal(id){$(id).classList.add('open');}
/* ===== viewer images ===== */
function openViewer(im){var all=[].slice.call(document.images).filter(function(x){return x.src;});
 VIEW.imgs=all;VIEW.i=Math.max(0,all.indexOf(im));showViewer();}
function showViewer(){var im=VIEW.imgs[VIEW.i];if(!im)return closeViewer();
 $('imgBig').src=im.src;$('imgBig').classList.remove('zoom');
 $('imgCap').textContent=im.alt||'';
 $('imgModal').classList.add('open');}
function closeViewer(){$('imgModal').classList.remove('open');$('vL').style.display='none';$('vR').style.display='none';}
function vnav(d){if(!VIEW.imgs.length)return;VIEW.i=(VIEW.i+d+VIEW.imgs.length)%VIEW.imgs.length;showViewer();}
/* ===== init ===== */
var a=$('audio');
a.ontimeupdate=function(){
 $('tTime').textContent=fmt(a.currentTime)+' / '+(isFinite(a.duration)&&a.duration?fmt(a.duration):'--:--');
 scrollLyr();};
a.onended=function(){var i=CURRENTLIST.indexOf(CURRENT);if(i>-1&&i<CURRENTLIST.length-1)play(CURRENTLIST[i+1],CURRENTLIST);};
$('grid').addEventListener('click',function(e){var b=e.target.closest('.play');if(b)play(TRACKS[+b.getAttribute('data-i')],TRACKS);});
$('plist').addEventListener('click',function(e){var r=e.target.closest('.prow');if(!r)return;
 var t=TRACKS.find(function(x){return x.title===r.getAttribute('data-t')&&String(x.file||'')===r.getAttribute('data-f');});
 if(t)play(t,plFlat());});
$('pstars').addEventListener('click',function(e){
 var sp=e.target;if(sp.tagName!=='SPAN')return;
 var k=1,el=sp;while(el.previousSibling){el=el.previousSibling;if(el.tagName==='SPAN')k++;}
 rate(k);});
$('btnSearch').onclick=render;
$('q').addEventListener('input',render);
$('btnReset').onclick=function(){$('q').value='';activeTag='';
 document.querySelectorAll('#tags .tag').forEach(function(x){x.classList.remove('on');});render();};
document.querySelectorAll('.modal').forEach(function(m){m.onclick=function(e){if(e.target===m)closeModal(m.id);};});
$('imgBig').onclick=function(){$('imgBig').classList.toggle('zoom');};
$('imgModal').addEventListener('mousemove',function(e){
 var w=this.clientWidth,x=e.clientX-this.getBoundingClientRect().left;
 $('vL').style.display=(x<w*0.15&&VIEW.imgs.length>1)?'block':'none';
 $('vR').style.display=(x>w*0.85&&VIEW.imgs.length>1)?'block':'none';});
document.addEventListener('click',function(e){
 var t=e.target;
 if(t&&t.tagName==='IMG'&&!t.closest('.modal'))openViewer(t);});
if(GHTOK)$('ghTok').value=GHTOK;
initAuth();
load();
</script>
